syntax = "proto3";

package auth;

service AuthService {
    rpc GetUserData (GetUserDataRequest) returns (UserData);
    rpc GetUserProfiles (UserProfilesRequest) returns (UserProfilesResponse);
    rpc SetGuestUser (GuestRequest) returns (GuestData);
}

message GetUserDataRequest {
    string email = 1;
}

message UserData {
    string id = 1;
    string displayName = 2;
    string email = 3;
    string avatarUrl = 4;
    string role = 5;
    string tier = 6;
}

message GuestRequest {
  string partId = 1;
  string sessionId = 2;
  string role = 3;
}

message GuestData {
  string token = 1;
}
message UserProfilesRequest { repeated string userIds = 1; }
message UserProfile { string id = 1; string displayName = 2; string avatarUrl = 3; }
message UserProfilesResponse { repeated UserProfile users = 1; }
