services:
  postgres:
    image: postgres:15.3
    container_name: postgres
    environment:
      POSTGRES_USER: pairscope
      POSTGRES_PASSWORD: PairScope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: ./service/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      AUTH_SERVICE_URL: "http://auth-service:3001"
    ports:
      - "3000:3000"

  auth-service:
    build:
      context: .
      dockerfile: ./service/auth-service/Dockerfile
    container_name: auth-service
    environment:
      DATABASE_URL: postgresql://pairscope:PairScope@postgres/auth
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  postgres_data: