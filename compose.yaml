services:
  postgres:
    image: postgres:15.3
    container_name: postgres
    environment:
      POSTGRES_USER: pairscope
      POSTGRES_PASSWORD: PairScope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: ./service/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      AUTH_SERVICE_URL: "http://auth-service:3001"
      SESSION_SERVICE_URL: "http://session-service:3002"
      ACCESS_SECRET: pairScopeAccessSecret
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - session-service

  auth-service:
    build:
      context: .
      dockerfile: ./service/auth-service/Dockerfile
    container_name: auth-service
    environment:
      DATABASE_URL: postgresql://pairscope:PairScope@postgres/auth
      ACCESS_SECRET: pairScopeAccessSecret
      REFRESH_SECRET: pairScopeRefreshSecret
    ports:
      - "3001:3001"
      - "50051:50051"
    depends_on:
      - postgres

  session-service:
    build:
      context: .
      dockerfile: ./service/session-service/Dockerfile
    container_name: session-service
    environment:
      DATABASE_URL: postgresql://pairscope:PairScope@postgres/session
      GRPC_AUTH_URL: "auth-service:50051"
    ports:
      - "3002:3002"
    depends_on:
      - postgres

volumes:
  postgres_data: