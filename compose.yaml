services:
  postgres:
    image: postgres:15.3
    container_name: postgres
    environment:
      POSTGRES_USER: pairscope
      POSTGRES_PASSWORD: PairScope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: ./service/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      AUTH_SERVICE_URL: "http://auth-service:3001"
      SESSION_SERVICE_URL: "http://session-service:3002"
      ORG_SERVICE_URL: "http://org-service:3003"
      REALTIME_SERVICE_URL: "http://realtime:3004"
      ACCESS_SECRET: pairScopeAccessSecret
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - session-service
      - org-service
      - realtime

  auth-service:
    build:
      context: .
      dockerfile: ./service/auth-service/Dockerfile
    container_name: auth-service
    environment:
      DATABASE_URL: postgresql://pairscope:PairScope@postgres/auth
      ACCESS_SECRET: pairScopeAccessSecret
      REFRESH_SECRET: pairScopeRefreshSecret
    ports:
      - "3001:3001"
      - "50051:50051"
    depends_on:
      - postgres

  session-service:
    build:
      context: .
      dockerfile: ./service/session-service/Dockerfile
    container_name: session-service
    environment:
      DATABASE_URL: postgresql://pairscope:PairScope@postgres/session
      GRPC_AUTH_URL: "auth-service:50051"
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  org-service:
    build: 
      context: .
      dockerfile: ./service/org-service/Dockerfile
    container_name: org-service
    environment:
      DATABASE_URL: postgresql://pairscope:PairScope@postgres/org
    ports:
      - "3003:3003"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  realtime:
    build:
      context: .
      dockerfile: ./service/realtime/Dockerfile
    environment:
      ACCESS_SECRET: pairScopeAccessSecret
      INTERNAL_SERVICE_SECRET: pairScopeInternalSecret
      REDIS_URL: redis://redis:6379
      SESSION_SERVICE_URL: http://session-service:3002
      CLIENT_URL: "${CLIENT_URL:-http://localhost:5173,http://127.0.0.1:5173}"
    expose:
      - "3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      session-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
